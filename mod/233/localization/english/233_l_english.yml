 233_events.4011:0 "I'm the author of this mod. What do you want to do"
 233_events.402:0 "I want to ask you some questions"
 233_events.4012:0 "Leaving here"
 233_events.4021:0 "What do you want to ask me"
 233_events.403:0 "Why is the name of this mod 233?"
 233_events.404:0 "What should I do if I find a bug?"
 233_events.405:0 "Do you have any special rewards for me?"
 233_events.4022:0 "I have no more questions"
 233_events.4031:0 "It's just that I wrote the code and typed 233 randomly. It doesn't mean anything. At first, it was called the leader change resolution. Later, if I wanted to do more, I used the name 233 directly"
 233_events.4032:0 "I see"
 233_events.4041:0 "I usually test this mod before updating, but there may be omissions. If you find a bug, please leave a message in the workshop message area.If it is a bug in this mod, I will fix it in time. In addition, if you have any good comments and suggestions, you can also leave a message"
 233_events.4013:0 "Why are you coming to me again"
 233_events.4051:0 "Well, I can only give you a buff, do you want to (hover over to check)"
 233_events.406:0 "I want it"
 233_events.4052:0 "I don't want it"
 233_events.4061:0 "Also, can you give mod a like?If you don't want this buff later, you can ask me to remove it"
 233_events.4062:0 "Yes, I accept"
 233_events.4063:0 "No, I want to pay for nothing"
 233_events.407:0 "Warp Gate"
 233_events.4071:0 "There is a mysterious warp gate. Do you want to open it?"
